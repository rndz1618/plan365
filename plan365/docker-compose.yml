# Plan365 on Docker — single container, SQLite volume (default) or PostgreSQL (optional)
services:
  plan365:
    build: .
    image: plan365:latest
    container_name: plan365
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - plan365-data:/data
    environment:
      - TZ=Asia/Jakarta
      - PLAN365_DB=/data/plan365.db
      # PostgreSQL configuration (optional)
      # - USE_POSTGRES=true
      # - POSTGRES_HOST=postgres
      # - POSTGRES_PORT=5432
      # - POSTGRES_DB=plan365
      # - POSTGRES_USER=postgres
      # - POSTGRES_PASSWORD=changeme
      # Override in production:
      # - PLAN365_SECRET_KEY=your-long-random-string
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: plan365-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=plan365
      - POSTGRES_USER=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    mem_limit: 256m
    memswap_limit: 256m

volumes:
  plan365-data:
  postgres-data:
