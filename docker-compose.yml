# Plan365 — SQLite (default) or PostgreSQL profile
#
# SQLite (SBC / simple):
#   docker compose up -d --build
#
# Use existing Postgres on host (recommended if already installed):
#   export PLAN365_DB_BACKEND=postgresql
#   export PLAN365_DATABASE_URL=postgresql://plan365:SECRET@127.0.0.1:5432/plan365
#   docker compose up -d --build
#   # do NOT enable profile postgres
#
# Optional isolated Postgres container (dev only):
#   export PLAN365_DB_BACKEND=postgresql
#   export PLAN365_DATABASE_URL=postgresql://plan365:plan365@postgres:5432/plan365
#   docker compose --profile postgres up -d --build

services:
  plan365:
    build: .
    image: plan365:latest
    container_name: plan365
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - plan365-data:/data
    environment:
      - TZ=Asia/Jakarta
      - PLAN365_DB=/data/plan365.db
      - PLAN365_DB_BACKEND=${PLAN365_DB_BACKEND:-sqlite}
      - PLAN365_DATABASE_URL=${PLAN365_DATABASE_URL:-}
    mem_limit: 256m
    memswap_limit: 256m

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    container_name: plan365-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plan365}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plan365}
      POSTGRES_DB: ${POSTGRES_DB:-plan365}
    volumes:
      - plan365-pgdata:/var/lib/postgresql/data
    # Bind localhost only — do NOT expose Postgres to 0.0.0.0
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plan365 -d plan365"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

volumes:
  plan365-data:
  plan365-pgdata:
